name: Deploy notification

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack of deploy result
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MSG: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            TEXT=":white_check_mark: Dashboard published successfully"
          else
            TEXT=":x: Dashboard publish FAILED (${CONCLUSION})"
          fi
          SHORT_SHA="${SHA:0:7}"
          FIRST_LINE="$(printf '%s' "$MSG" | head -n1)"
          BODY="${TEXT}"$'\n'"commit ${SHORT_SHA} — ${FIRST_LINE}"$'\n'"${RUN_URL}"
          payload="$(jq -n --arg text "$BODY" '{text:$text}')"
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
